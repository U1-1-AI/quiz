<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>期末成本会计刷题酱</title>
<style>
:root {
  --bg: #f5f0eb;
  --card: #fffbf7;
  --text: #2c2416;
  --sub: #8b7355;
  --border: #e5d9cc;
  --shadow: 0 1px 3px rgba(44,36,22,.06);
  --correct: #2d8a56;
  --wrong: #c0392b;
  --accent: #b8860b;
  --accent-light: #fef3c7;
  --radius: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height:100vh;
  -webkit-tap-highlight-color: transparent;
}

/* ===== LOCK SCREEN ===== */
.lock-screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; padding: 24px; text-align: center;
}
.lock-card {
  background: var(--card); border-radius: 16px; padding: 40px 28px;
  box-shadow: var(--shadow); border: 1px solid var(--border);
  max-width: 380px; width: 100%;
}
.lock-card h1 { font-size: 22px; margin-bottom: 4px; }
.lock-card .subtitle { font-size: 13px; color: var(--sub); margin-bottom: 28px; }
.lock-card input {
  width: 100%; padding: 12px 16px; border: 2px solid var(--border);
  border-radius: var(--radius); font-size: 18px; text-align: center;
  letter-spacing: 2px; background: var(--bg); outline: none;
  font-family: "SF Mono","Consolas","Courier New",monospace;
}
.lock-card input:focus { border-color: var(--accent); }
.lock-card .btn {
  width: 100%; margin-top: 16px; padding: 12px; border: none;
  border-radius: var(--radius); background: var(--accent);
  color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
}
.lock-card .btn:active { filter: brightness(.9); }
.lock-card .hint {
  margin-top: 12px; font-size: 12px; color: var(--sub);
}
.lock-error { color: var(--wrong); font-size: 13px; margin-top: 8px; min-height: 20px; }

/* ===== HOME ===== */
.container { max-width: 680px; margin: 0 auto; padding: 20px 16px 40px; }
.header { text-align: center; padding: 32px 0 20px; }
.header h1 { font-size: 24px; }
.header .stats { font-size: 13px; color: var(--sub); margin-top: 4px; }

.chapter-grid { display: flex; flex-direction: column; gap: 10px; }
.chapter-card {
  background: var(--card); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow); border: 1px solid var(--border);
  cursor: pointer; transition: transform .15s;
  display: flex; justify-content: space-between; align-items: center;
}
.chapter-card:active { transform: scale(.98); }
.chapter-card .ch-info { flex: 1; }
.chapter-card .ch-name { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
.chapter-card .ch-meta { font-size: 12px; color: var(--sub); }
.chapter-card .ch-badge {
  background: var(--accent-light); color: var(--accent);
  padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
  white-space: nowrap;
}

/* ===== BOOKMARK & HISTORY SECTIONS ===== */
.extra-section {
  max-width: 680px; margin: 16px auto 0; padding: 0 16px;
}
.section-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px; cursor: pointer; padding: 10px 14px;
  background: var(--card); border-radius: var(--radius);
  border: 1px solid var(--border);
}
.section-header h3 { font-size: 14px; font-weight: 700; }
.section-toggle { font-size: 12px; color: var(--sub); }
.history-list, .bookmark-list { display: flex; flex-direction: column; gap: 6px; }
.history-item, .bookmark-item {
  background: var(--card); border-radius: 10px; padding: 10px 14px;
  box-shadow: var(--shadow); border: 1px solid var(--border); font-size: 13px;
}
.history-item { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.bookmark-item { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.hi-info { flex: 1; }
.hi-chapter { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
.hi-meta { font-size: 11px; color: var(--sub); }
.hi-score { font-size: 22px; font-weight: 800; text-align: center; min-width: 56px; }
.hi-score.high { color: var(--correct); }
.hi-score.mid { color: #f59e0b; }
.hi-score.low { color: var(--wrong); }
.bm-q { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bm-remove { background: none; border: none; color: #999; cursor: pointer; font-size: 16px; padding: 4px 8px; }
.empty-state { text-align: center; padding: 20px; color: var(--sub); font-size: 13px; }

/* ===== QUIZ MODE ===== */
.quiz-container { max-width: 680px; margin: 0 auto; padding: 12px 16px 40px; }
.quiz-topbar {
  display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.quiz-topbar .back-btn {
  background: none; border: none; font-size: 16px; cursor: pointer;
  color: var(--accent); padding: 4px 8px;
}
.quiz-topbar .quiz-title { flex: 1; font-weight: 600; font-size: 15px; text-align: center; }
.quiz-topbar .progress { font-size: 12px; color: var(--sub); white-space: nowrap; }
.bookmark-btn {
  background: none; border: none; font-size: 22px; cursor: pointer; padding: 2px 4px;
  transition: transform .2s; line-height: 1;
}
.bookmark-btn:active { transform: scale(1.3); }
.bookmark-btn.bookmarked { color: #f59e0b; }

.question-card {
  background: var(--card); border-radius: var(--radius); padding: 20px 18px;
  box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 16px;
}
.question-text { font-size: 16px; line-height: 1.7; margin-bottom: 16px; }
.question-type {
  display: inline-block; font-size: 11px; padding: 2px 8px;
  border-radius: 10px; background: var(--accent-light); color: var(--accent);
  margin-bottom: 8px;
}
.option-list { display: flex; flex-direction: column; gap: 8px; }
.option-item {
  padding: 12px 14px; border: 2px solid var(--border); border-radius: 10px;
  cursor: pointer; font-size: 15px; transition: all .15s;
  display: flex; align-items: center; gap: 10px;
}
.option-item:active { transform: scale(.98); }
.option-item.selected { border-color: var(--accent); background: var(--accent-light); }
.option-item.correct { border-color: var(--correct); background: #eaf7f0; }
.option-item.wrong { border-color: var(--wrong); background: #fdecea; }
.option-item .letter {
  width: 28px; height: 28px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-weight: 700;
  font-size: 14px; background: var(--bg); flex-shrink: 0;
}
.option-item.selected .letter { background: var(--accent); color: #fff; }
.option-item.correct .letter { background: var(--correct); color: #fff; }
.option-item.wrong .letter { background: var(--wrong); color: #fff; }

.judge-btns { display: flex; gap: 10px; }
.judge-btn {
  flex: 1; padding: 14px; border: 2px solid var(--border); border-radius: 10px;
  font-size: 16px; cursor: pointer; text-align: center; background: var(--card);
  font-weight: 600;
}
.judge-btn.correct { border-color: var(--correct); background: #eaf7f0; color: var(--correct); }
.judge-btn.wrong { border-color: var(--wrong); background: #fdecea; color: var(--wrong); }

.action-bar { display: flex; gap: 10px; margin-top: 16px; }
.action-bar button {
  flex: 1; padding: 12px; border: none; border-radius: var(--radius);
  font-size: 15px; font-weight: 600; cursor: pointer;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-outline { background: var(--card); color: var(--text); border: 2px solid var(--border) !important; }
.btn-outline:disabled { opacity: .4; }
.action-bar button:active { filter: brightness(.9); }

.feedback {
  text-align: center; font-size: 15px; font-weight: 600; margin-top: 12px;
  min-height: 24px;
}
.feedback.correct { color: var(--correct); }
.feedback.wrong { color: var(--wrong); }

/* ===== RESULT MODE ===== */
.result-container { max-width: 680px; margin: 0 auto; padding: 24px 16px 40px; text-align: center; }
.result-score {
  font-size: 72px; font-weight: 800; line-height: 1;
}
.result-label { font-size: 14px; color: var(--sub); margin: 8px 0 20px; }
.result-stats {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--card); border-radius: var(--radius); padding: 14px 8px;
  box-shadow: var(--shadow); border: 1px solid var(--border);
}
.stat-card .stat-num { font-size: 24px; font-weight: 700; }
.stat-card .stat-label { font-size: 11px; color: var(--sub); margin-top: 2px; }

.review-list { text-align: left; margin-bottom: 20px; }
.review-list h3 { font-size: 15px; margin-bottom: 10px; }
.review-item {
  background: var(--card); border-radius: 10px; padding: 12px 14px;
  box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 8px;
  font-size: 14px; line-height: 1.6;
}
.review-item .your-answer { color: var(--wrong); }
.review-item .correct-answer { color: var(--correct); }

.result-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.result-actions button {
  padding: 12px 20px; border: none; border-radius: var(--radius);
  font-size: 15px; font-weight: 600; cursor: pointer;
}

/* ===== QR MODAL ===== */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.5); z-index: 100;
  align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-content {
  background: var(--card); border-radius: 16px; padding: 24px;
  text-align: center; max-width: 340px; width: 90%;
}
.modal-content img { max-width: 260px; border-radius: 8px; }
.modal-close {
  margin-top: 12px; padding: 8px 24px; border: none; border-radius: 8px;
  background: var(--accent); color: #fff; font-size: 14px; cursor: pointer;
}

/* ===== FOOTER ===== */
.footer-actions {
  text-align: center; padding: 12px; font-size: 12px; color: var(--sub);
}
.footer-actions span { cursor: pointer; }
.footer-actions span:hover { color: var(--wrong); }

@media (max-width: 480px) {
  .result-stats { grid-template-columns: repeat(2, 1fr); }
  .lock-card { padding: 28px 18px; }
}
</style>
</head>

<!-- LOCK SCREEN -->
<div id="lockScreen" class="lock-screen">
  <div class="lock-card">
    <h1>期末成本会计刷题酱</h1>
    <p class="subtitle">共 12 章 · 591 题</p>
    <input type="text" id="codeInput" placeholder="输入12位激活码" maxlength="17" autocomplete="off">
    <button class="btn" onclick="doActivate()">激活解锁</button>
    <p class="lock-error" id="lockError"></p>
    <p class="hint">格式：XXXX-XXXX-XXXX</p>
  </div>
</div>

<!-- HOME SCREEN -->

    <div class="header">
      <h1>期末成本会计刷题酱</h1>

          style="flex:1;max-width:280px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:12px;background:var(--card)"
          onchange="saveHostUrl()">
        <button onclick="showPageQR()" style="padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap">📱 生成二维码</button>
      </div>
    </div>
    <div class="chapter-grid" id="chapterGrid"></div>
  </div>

  <div class="extra-section" id="bookmarkSection" style="display:none">
    <div class="section-header" onclick="toggleSection('bookmarkList')">
      <h3>⭐ 收藏题目</h3>
      <span class="section-toggle" id="bookmarkToggle">展开</span>
    </div>
    <div id="bookmarkList" style="display:none"></div>
  </div>

  <div class="extra-section" id="historySection" style="display:none">
    <div class="section-header" onclick="toggleSection('historyList')">
      <h3>📊 刷题历史</h3>
      <span style="display:flex;gap:8px;align-items:center">
        <span class="section-toggle" id="historyToggle">展开</span>
        <span onclick="event.stopPropagation();clearHistory()" style="font-size:11px;color:var(--sub);cursor:pointer" title="清除历史">✕</span>
      </span>
    </div>
    <div id="historyList" style="display:none"></div>
  </div>

  <div class="footer-actions">
    <span onclick="resetAll()">🗑 清除所有记录</span>
  </div>
</div>

<!-- QUIZ MODE -->
<div id="quizMode" style="display:none">
  <div class="quiz-container">
    <div class="quiz-topbar">
      <button class="back-btn" onclick="goHome()">← 返回</button>
      <span class="quiz-title" id="quizTitle"></span>
      <button id="btnBookmark" class="bookmark-btn" onclick="toggleBookmark()" title="收藏此题">☆</button>
      <span class="progress" id="progressText"></span>
    </div>
    <div id="quizBody"></div>
  </div>
</div>

<!-- RESULT MODE -->
<div id="resultMode" style="display:none">
  <div class="result-container" id="resultContent"></div>
</div>

<!-- QR MODAL -->
<div class="modal-overlay" id="qrModal">
  <div class="modal-content">
    <h4 id="qrTitle" style="margin-bottom:10px"></h4>
    <img id="qrImg" src="" alt="QR">
    <br>
    <button class="modal-close" onclick="closeQR()">关闭</button>
  </div>
</div>

const ACTIVATION_KEY = 'quiz_cost_acc_activated_v1';

function doActivate() {
  const input = document.getElementById('codeInput');
  const raw = input.value.replace(/-/g, '').toUpperCase();
  const errEl = document.getElementById('lockError');

  if (raw.length !== 12) {
    errEl.textContent = '激活码应为12位字符';
    return;
  }

  const encoder = new TextEncoder();
  crypto.subtle.digest('SHA-256', encoder.encode(raw)).then(hashBuffer => {
    const hashHex = Array.from(new Uint8Array(hashBuffer))
      .map(b => b.toString(16).padStart(2, '0')).join('');
    if (VALID_HASHES.includes(hashHex)) {
      localStorage.setItem(ACTIVATION_KEY, raw);
      showHome();
    } else {
      errEl.textContent = '激活码无效，请检查后重试';
      input.value = '';
      input.focus();
    }
  }).catch(() => {
    errEl.textContent = '验证失败，请重试';
  });
}

document.getElementById('codeInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doActivate();
  // Auto-format: add dashes
  if (e.key === 'Backspace') return;
  const raw = this.value.replace(/-/g, '');
  if (raw.length >= 12) { e.preventDefault(); return; }
  if (raw.length === 4 || raw.length === 8) {
    this.value = raw + '-';
  }
});

function checkActivation() {
  const saved = localStorage.getItem(ACTIVATION_KEY);
  if (saved && saved.length === 12) {
    showHome();
  } else {
    document.getElementById('lockScreen').style.display = 'flex';
  }
}

// ==================== QUIZ ENGINE ====================
let currentChapter = null;
let quizQuestions = [];
let currentIndex = 0;
let userAnswers = [];
let isRevealed = false;
let isShuffled = false;

function startChapter(chName) {
  const ch = QUESTION_BANK[chName];
  if (!ch) return;

  currentChapter = chName;
  quizQuestions = [...ch.questions];
  currentIndex = 0;
  isShuffled = false;
  userAnswers = quizQuestions.map(q => q.type === 'multi' ? [] : -1);
  isRevealed = false;

  document.getElementById('homeMode').style.display = 'none';
  document.getElementById('resultMode').style.display = 'none';
  document.getElementById('quizMode').style.display = 'block';
  document.getElementById('quizTitle').textContent = chName;
  renderQuestion();
  updateBookmarkBtn();
}

function shuffleQuestions() {
  // Fisher-Yates shuffle
  for (let i = quizQuestions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [quizQuestions[i], quizQuestions[j]] = [quizQuestions[j], quizQuestions[i]];
    [userAnswers[i], userAnswers[j]] = [userAnswers[j], userAnswers[i]];
  }
  currentIndex = 0;
  isShuffled = true;
  isRevealed = false;
  renderQuestion();
}

function renderQuestion() {
  if (currentIndex >= quizQuestions.length) {
    showResult();
    return;
  }

  const q = quizQuestions[currentIndex];
  const body = document.getElementById('quizBody');
  const total = quizQuestions.length;
  document.getElementById('progressText').textContent = (currentIndex + 1) + '/' + total;
  updateBookmarkBtn();

  const typeLabel = {'single': '单选题', 'multi': '多选题（可多选）', 'judge': '判断题'}[q.type] || '';

  let optionsHtml = '';
  if (q.type === 'single' || q.type === 'multi') {
    const letters = ['A','B','C','D','E','F','G'];
    const selectedSet = q.type === 'multi' ? new Set(userAnswers[currentIndex] || []) : new Set([userAnswers[currentIndex]]);
    const correctSet = new Set(q.type === 'multi' ? q.a : [q.a]);

    optionsHtml = '<div class="option-list">';
    q.o.forEach((opt, i) => {
      let cls = 'option-item';

      if (isRevealed) {
        if (correctSet.has(i)) cls += ' correct';
        else if (selectedSet.has(i) && !correctSet.has(i)) cls += ' wrong';
      } else if (selectedSet.has(i)) {
        cls += ' selected';
      }

      optionsHtml += '<div class="' + cls + '" onclick="selectOption(' + i + ', \'' + q.type + '\')">' +
        '<span class="letter">' + letters[i] + '</span>' +
        '<span>' + escHtml(opt) + '</span>' +
      '</div>';
    });
    optionsHtml += '</div>';
  } else if (q.type === 'judge') {
    const sel = userAnswers[currentIndex];
    let cls0 = 'judge-btn', cls1 = 'judge-btn';
    if (isRevealed) {
      cls0 += (q.a === 0 ? ' correct' : (sel === 0 ? ' wrong' : ''));
      cls1 += (q.a === 1 ? ' correct' : (sel === 1 ? ' wrong' : ''));
    } else {
      if (sel === 0) cls0 += ' correct';
      if (sel === 1) cls1 += ' wrong';
    }
    optionsHtml = '<div class="judge-btns">' +
      '<div class="' + cls0 + '" onclick="selectJudge(0)">✓ 正确</div>' +
      '<div class="' + cls1 + '" onclick="selectJudge(1)">✗ 错误</div>' +
    '</div>';
  }

  let actionHtml = '';
  if (!isRevealed) {
    if (q.type === 'multi') {
      actionHtml = '<div class="action-bar">' +
        '<button class="btn-outline" onclick="skipQuestion()" ' + (userAnswers[currentIndex] !== -1 && (userAnswers[currentIndex]||[]).length > 0 ? '' : '') + '>跳过</button>' +
        '<button class="btn-outline" onclick="shuffleQuestions()">🔀 打乱</button>' +
        '<button class="btn-primary" onclick="confirmMultiAnswer()">确认答案</button>' +
      '</div>';
    } else {
      actionHtml = '<div class="action-bar">' +
        '<button class="btn-outline" onclick="skipQuestion()">跳过</button>' +
        '<button class="btn-outline" onclick="shuffleQuestions()">🔀 打乱</button>' +
        '<button class="btn-outline" style="opacity:.4">' + (q.type === 'single' ? '点击选项作答' : '点击正确/错误作答') + '</button>' +
      '</div>';
    }
  } else {
    actionHtml = '<div class="action-bar">' +
      (currentIndex < quizQuestions.length - 1
        ? '<button class="btn-primary" onclick="nextQuestion()">下一题 →</button>'
        : '<button class="btn-primary" onclick="showResult()">查看成绩 →</button>') +
    '</div>';
  }

  body.innerHTML =
    '<div class="question-card">' +
      '<span class="question-type">' + typeLabel + '</span>' +
      '<div class="question-text">' + escHtml(q.q) + '</div>' +
      optionsHtml +
    '</div>' +
    '<div class="feedback ' + (isRevealed ? (isAnswerCorrect() ? 'correct' : 'wrong') : '') + '" id="feedback">' +
      (isRevealed ? (isAnswerCorrect() ? '✓ 回答正确！' : '✗ 回答错误') : '') +
    '</div>' +
    actionHtml;
}

function selectOption(idx, qtype) {
  if (isRevealed) return;
  const q = quizQuestions[currentIndex];

  if (qtype === 'single') {
    userAnswers[currentIndex] = idx;
    isRevealed = true;
    renderQuestion();
    // Auto-advance after correct
    if (isAnswerCorrect()) {
      setTimeout(() => {
        if (currentIndex < quizQuestions.length - 1) {
          currentIndex++;
          isRevealed = false;
          renderQuestion();
        }
      }, 800);
    }
  } else if (qtype === 'multi') {
    if (!Array.isArray(userAnswers[currentIndex])) {
      userAnswers[currentIndex] = [];
    }
    const arr = userAnswers[currentIndex];
    const pos = arr.indexOf(idx);
    if (pos >= 0) arr.splice(pos, 1);
    else arr.push(idx);
    renderQuestion();
  }
}

function selectJudge(val) {
  if (isRevealed) return;
  userAnswers[currentIndex] = val;
  isRevealed = true;
  renderQuestion();
  // Auto-advance after correct
  if (isAnswerCorrect()) {
    setTimeout(() => {
      if (currentIndex < quizQuestions.length - 1) {
        currentIndex++;
        isRevealed = false;
        renderQuestion();
      }
    }, 800);
  }
}

function confirmMultiAnswer() {
  if (isRevealed) return;
  if (!Array.isArray(userAnswers[currentIndex]) || userAnswers[currentIndex].length === 0) return;
  isRevealed = true;
  renderQuestion();
}

function skipQuestion() {
  if (isRevealed) return;
  if (currentIndex < quizQuestions.length - 1) {
    currentIndex++;
    isRevealed = false;
    renderQuestion();
  }
}

function nextQuestion() {
  currentIndex++;
  isRevealed = false;
  renderQuestion();
}

function isAnswerCorrect() {
  const q = quizQuestions[currentIndex];
  const ua = userAnswers[currentIndex];
  if (q.type === 'multi') {
    const correct = new Set(q.a);
    const user = new Set(ua || []);
    return correct.size === user.size && [...correct].every(v => user.has(v));
  }
  return ua === q.a;
}

// ==================== RESULT ====================
function showResult() {
  document.getElementById('quizMode').style.display = 'none';
  document.getElementById('resultMode').style.display = 'block';

  let correct = 0, wrong = 0, skipped = 0;
  const reviewItems = [];

  quizQuestions.forEach((q, i) => {
    const ua = userAnswers[i];
    if (q.type === 'multi') {
      if (!Array.isArray(ua) || ua.length === 0) {
        skipped++;
        reviewItems.push({q, ua: [], correct: false, skipped: true});
      } else {
        const correctSet = new Set(q.a);
        const userSet = new Set(ua);
        const isCorrect = correctSet.size === userSet.size && [...correctSet].every(v => userSet.has(v));
        if (isCorrect) correct++;
        else wrong++;
        reviewItems.push({q, ua, correct: isCorrect});
      }
    } else {
      if (ua === -1) {
        skipped++;
        reviewItems.push({q, ua: null, correct: false, skipped: true});
      } else {
        if (ua === q.a) correct++;
        else wrong++;
        reviewItems.push({q, ua, correct: ua === q.a});
      }
    }
  });

  const answered = correct + wrong;
  const pct = answered > 0 ? Math.round(correct / answered * 100) : 0;

  let html = '<div class="result-score" style="color:' + (pct >= 80 ? 'var(--correct)' : pct >= 60 ? '#f59e0b' : 'var(--wrong)') + '">' +
    pct + '%</div>' +
    '<div class="result-label">' + currentChapter + '</div>' +
    '<div class="result-stats">' +
      '<div class="stat-card"><div class="stat-num" style="color:var(--correct)">' + correct + '</div><div class="stat-label">正确</div></div>' +
      '<div class="stat-card"><div class="stat-num" style="color:var(--wrong)">' + wrong + '</div><div class="stat-label">错误</div></div>' +
      '<div class="stat-card"><div class="stat-num" style="color:var(--sub)">' + skipped + '</div><div class="stat-label">跳过</div></div>' +
      '<div class="stat-card"><div class="stat-num">' + answered + '</div><div class="stat-label">已答</div></div>' +
    '</div>';

  // Review section
  const wrongItems = reviewItems.filter(r => !r.correct);
  if (wrongItems.length > 0) {
    html += '<div class="review-list"><h3>错题回顾</h3>';
    wrongItems.forEach((r, ri) => {
      const q = r.q;
      let yourAns = '未作答';
      let correctAns = '';
      if (q.type === 'single') {
        const letters = ['A','B','C','D','E'];
        if (r.ua !== null && r.ua !== -1) yourAns = '<span class="your-answer">' + letters[r.ua] + '. ' + escHtml(q.o[r.ua]) + '</span>';
        else yourAns = '<span class="your-answer">未作答</span>';
        correctAns = '<span class="correct-answer">' + letters[q.a] + '. ' + escHtml(q.o[q.a]) + '</span>';
      } else if (q.type === 'multi') {
        const letters = ['A','B','C','D','E'];
        if (r.ua && r.ua.length > 0) {
          yourAns = '<span class="your-answer">' + r.ua.map(i => letters[i]).join('') + '</span>';
        } else {
          yourAns = '<span class="your-answer">未作答</span>';
        }
        correctAns = '<span class="correct-answer">' + q.a.map(i => letters[i]).join('') + '</span>';
      } else if (q.type === 'judge') {
        if (r.ua === 0) yourAns = '<span class="your-answer">正确</span>';
        else if (r.ua === 1) yourAns = '<span class="your-answer">错误</span>';
        else yourAns = '<span class="your-answer">未作答</span>';
        correctAns = '<span class="correct-answer">' + (q.a === 0 ? '正确' : '错误') + '</span>';
      }
      html += '<div class="review-item"><strong>' + (ri+1) + '.</strong> ' + escHtml(q.q.substring(0, 80)) +
        '<br>你的答案：' + yourAns + ' | 正确答案：' + correctAns + '</div>';
    });
    html += '</div>';
  }

  html += '<div class="result-actions">' +
    '<button class="btn-primary" onclick="retryWrong()" ' + (wrongItems.length === 0 ? 'disabled style="opacity:.4"' : '') + '>🔄 重做错题 (' + wrongItems.length + ')</button>' +
    '<button class="btn-outline" onclick="startChapter(\'' + escAttr(currentChapter) + '\')">🔀 重新开始</button>' +
    '<button class="btn-outline" onclick="goHome()">← 返回章节列表</button>' +
  '</div>';

  document.getElementById('resultContent').innerHTML = html;

  // Record history
  recordHistory(currentChapter, correct, answered, quizQuestions.length, pct);

  // Save stats
  saveStats(currentChapter, correct, answered, quizQuestions.length);
}

function retryWrong() {
  const wrongQs = [];
  const wrongAnswers = [];
  quizQuestions.forEach((q, i) => {
    if (!isAnswerCorrectForIndex(i)) {
      wrongQs.push(q);
      wrongAnswers.push(q.type === 'multi' ? [] : -1);
    }
  });
  if (wrongQs.length === 0) return;
  quizQuestions = wrongQs;
  userAnswers = wrongAnswers;
  currentIndex = 0;
  isRevealed = false;
  document.getElementById('resultMode').style.display = 'none';
  document.getElementById('quizMode').style.display = 'block';
  document.getElementById('quizTitle').textContent = currentChapter + ' · 错题重做';
  renderQuestion();
}

function isAnswerCorrectForIndex(i) {
  const q = quizQuestions[i];
  const ua = userAnswers[i];
  if (q.type === 'multi') {
    const correctSet = new Set(q.a);
    const userSet = new Set(ua || []);
    return correctSet.size === userSet.size && [...correctSet].every(v => userSet.has(v));
  }
  return ua === q.a;
}

// ==================== STATS & HISTORY ====================
const STATS_KEY = 'quiz_cost_acc_stats_v1';
const HISTORY_KEY = 'quiz_cost_acc_history_v1';
const BOOKMARK_KEY = 'quiz_cost_acc_bookmarks_v1';

function loadStats(chName) {
  try {
    const all = JSON.parse(localStorage.getItem(STATS_KEY)) || {};
    return all[chName] || null;
  } catch(e) { return null; }
}

function saveStats(chName, correct, answered, total) {
  try {
    const all = JSON.parse(localStorage.getItem(STATS_KEY)) || {};
    all[chName] = { correct, answered, total, pct: answered > 0 ? Math.round(correct/answered*100) : 0, time: new Date().toISOString() };
    localStorage.setItem(STATS_KEY, JSON.stringify(all));
  } catch(e) {}
}

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch(e) { return []; }
}

function recordHistory(chapter, correct, answered, quizTotal, pct) {
  const history = loadHistory();
  history.unshift({ chapter, correct, total: answered, quizTotal, pct, time: new Date().toISOString() });
  if (history.length > 50) history.length = 50;
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch(e) {}
}

function renderHistory() {
  const container = document.getElementById('historyList');
  const section = document.getElementById('historySection');
  const history = loadHistory();
  if (history.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';

  let html = '<div class="history-list">';
  history.forEach(h => {
    const d = new Date(h.time);
    const ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    const cls = h.pct >= 80 ? 'high' : (h.pct >= 60 ? 'mid' : 'low');
    html += '<div class="history-item" onclick="startChapter(\'' + escAttr(h.chapter) + '\')">' +
      '<div class="hi-info"><div class="hi-chapter">' + escHtml(h.chapter) + '</div>' +
      '<div class="hi-meta">' + ds + ' | ' + h.correct + '/' + h.quizTotal + ' 正确</div></div>' +
      '<div class="hi-score ' + cls + '">' + h.pct + '%</div></div>';
  });
  html += '</div>';
  container.innerHTML = html;
}

function clearHistory() {
  if (confirm('确定要清除所有刷题历史吗？此操作不可恢复。')) {
    localStorage.removeItem(HISTORY_KEY);
    renderHistory();
  }
}

function resetAll() {
  if (confirm('确定要清除所有记录（包含激活状态）吗？')) {
    localStorage.removeItem(ACTIVATION_KEY);
    localStorage.removeItem(STATS_KEY);
    localStorage.removeItem(HISTORY_KEY);
    localStorage.removeItem(BOOKMARK_KEY);
    location.reload();
  }
}

// ==================== BOOKMARKS ====================
function loadBookmarks() {
  try { return JSON.parse(localStorage.getItem(BOOKMARK_KEY)) || {}; } catch(e) { return {}; }
}

function saveBookmarks(bm) {
  try { localStorage.setItem(BOOKMARK_KEY, JSON.stringify(bm)); } catch(e) {}
}

function toggleBookmark() {
  if (!currentChapter || currentIndex >= quizQuestions.length) return;
  const q = quizQuestions[currentIndex];
  const bm = loadBookmarks();
  const key = currentChapter + '|||' + currentIndex;
  if (bm[key]) { delete bm[key]; }
  else { bm[key] = { chapter: currentChapter, index: currentIndex, q: q.q.substring(0, 80), type: q.type, time: new Date().toISOString() }; }
  saveBookmarks(bm);
  updateBookmarkBtn();
}

function updateBookmarkBtn() {
  if (!currentChapter) return;
  const bm = loadBookmarks();
  const key = currentChapter + '|||' + currentIndex;
  const btn = document.getElementById('btnBookmark');
  if (!btn) return;
  if (bm[key]) { btn.textContent = '★'; btn.classList.add('bookmarked'); }
  else { btn.textContent = '☆'; btn.classList.remove('bookmarked'); }
}

function renderBookmarks() {
  const container = document.getElementById('bookmarkList');
  const section = document.getElementById('bookmarkSection');
  const bm = loadBookmarks();
  const entries = Object.entries(bm);
  if (entries.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';

  let html = '<div class="bookmark-list">';
  entries.sort((a,b) => new Date(b[1].time) - new Date(a[1].time));
  entries.forEach(([key, b]) => {
    const tl = {single:'单选', multi:'多选', judge:'判断'}[b.type] || b.type;
    html += '<div class="bookmark-item" onclick="goToBookmark(\'' + escAttr(key) + '\')">' +
      '<div class="bm-q"><strong>[' + tl + ']</strong> ' + escHtml(b.q) + '</div>' +
      '<button class="bm-remove" onclick="event.stopPropagation();removeBookmark(\'' + escAttr(key) + '\')">×</button></div>';
  });
  html += '</div>';
  container.innerHTML = html;
}

function goToBookmark(key) {
  const parts = key.split('|||');
  const chName = parts[0];
  const qIdx = parseInt(parts[1]);
  if (!QUESTION_BANK[chName]) return;
  currentChapter = chName;
  quizQuestions = [...QUESTION_BANK[chName].questions];
  currentIndex = qIdx;
  userAnswers = quizQuestions.map(q => q.type === 'multi' ? [] : -1);
  isRevealed = false;
  document.getElementById('homeMode').style.display = 'none';
  document.getElementById('resultMode').style.display = 'none';
  document.getElementById('quizMode').style.display = 'block';
  document.getElementById('quizTitle').textContent = chName;
  renderQuestion();
  updateBookmarkBtn();
}

function removeBookmark(key) {
  const bm = loadBookmarks();
  delete bm[key];
  saveBookmarks(bm);
  renderBookmarks();
  updateBookmarkBtn();
}

function toggleSection(id) {
  const el = document.getElementById(id);
  const toggle = document.getElementById(id.replace('List','Toggle'));
  if (el.style.display === 'none') { el.style.display = 'block'; if (toggle) toggle.textContent = '收起'; }
  else { el.style.display = 'none'; if (toggle) toggle.textContent = '展开'; }
}

// ==================== UTILS ====================
function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s) {
  if (!s) return '';
  return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"');
}

// ==================== QR CODE ====================
const HOST_URL_KEY = 'quiz_host_url_v1';

function loadHostUrl() {
  const saved = localStorage.getItem(HOST_URL_KEY) || '';
  if (saved) return saved;
  if (window.location.protocol.startsWith('http')) {
    return window.location.href.replace(/#.*$/, '').replace(/\?.*$/, '');
  }
  return 'https://u1-1-ai.github.io/quiz/quiz-app.html';
}

function saveHostUrl() {
  const val = document.getElementById('baseUrl').value.trim();
  if (val) localStorage.setItem(HOST_URL_KEY, val);
}

function showPageQR() {
  const hostUrl = document.getElementById('baseUrl').value.trim() || loadHostUrl();
  if (!hostUrl) {
    alert('请先填写网页线上地址（部署到 GitHub Pages 后的网址）');
    return;
  }
  saveHostUrl();
  const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(hostUrl);
  document.getElementById('qrTitle').textContent = '扫码打开「期末成本会计刷题酱」';
  document.getElementById('qrImg').src = qrUrl;
  document.getElementById('qrModal').classList.add('show');
}

function closeQR() {
  document.getElementById('qrModal').classList.remove('show');
}

document.getElementById('qrModal').addEventListener('click', function(e) {
  if (e.target === this) closeQR();
});

// Init baseUrl on home load
document.addEventListener('DOMContentLoaded', function() {
  const saved = loadHostUrl();
  if (saved) document.getElementById('baseUrl').value = saved;
});

// ==================== DEEP LINK ====================
function handleDeepLink() {
  const hash = window.location.hash;
  if (hash.startsWith('#chapter=')) {
    const chName = decodeURIComponent(hash.substring('#chapter='.length));
    if (QUESTION_BANK[chName]) {
      startChapter(chName);
    }
  }
}

// ==================== INIT ====================
checkActivation();
// Check for deep-link after activation
if (localStorage.getItem(ACTIVATION_KEY)) {
  setTimeout(handleDeepLink, 100);
}
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财务管理刷题练习</title>
<style>
:root {
  --bg: #f0f2f5;
  --card: #fff;
  --text: #1a1a1a;
  --sub: #888;
  --accent: #4f46e5;
  --accent-light: #eef2ff;
  --correct: #16a34a;
  --correct-bg: #f0fdf4;
  --wrong: #dc2626;
  --wrong-bg: #fef2f2;
  --border: #e5e7eb;
  --radius: 14px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* ========== HOME / CHAPTER LIST ========== */
.home-wrap {
  max-width: 600px;
  margin: 0 auto;
  padding: 32px 16px 60px;
}
.home-header {
  text-align: center;
  margin-bottom: 28px;
}
.home-header h1 {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 4px;
}
.home-header .subtitle {
  font-size: 13px;
  color: var(--sub);
}
.chapter-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.chapter-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all .15s;
  text-align: left;
}
.chapter-card:active { transform: scale(0.98); background: #fafafa; }
.chapter-card .ch-info { flex: 1; }
.chapter-card .ch-name {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 4px;
}
.chapter-card .ch-meta {
  font-size: 12px;
  color: var(--sub);
  display: flex;
  gap: 12px;
}
.chapter-card .ch-arrow { color: #ccc; font-size: 20px; }
.type-badge {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 4px;
  font-weight: 600;
}
.type-badge.single { background: #dbeafe; color: #2563eb; }
.type-badge.multi { background: #fef3c7; color: #d97706; }
.type-badge.judge { background: #ede9fe; color: #7c3aed; }
.ch-stats {
  margin-top: 6px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 11px;
}
.ch-stat-item { color: var(--sub); }
.ch-stat-item.best { color: #16a34a; font-weight: 600; }
.ch-stat-item.last { color: var(--accent); font-weight: 600; }
.ch-stat-new { color: #cbd5e1; font-size: 11px; }

/* Explanation box */
.explanation-box {
  background: #fffbeb;
  border-radius: 10px;
  padding: 12px 14px;
  margin-top: 10px;
  font-size: 13px;
  color: #92400e;
  line-height: 1.6;
  border-left: 3px solid #f59e0b;
}
.explanation-box .exp-label {
  font-weight: 700;
  font-size: 11px;
  display: block;
  margin-bottom: 2px;
  color: #b45309;
}

/* ========== URL input bar ========== */
.url-bar {
  max-width: 600px;
  margin: 0 auto 0;
  padding: 0 16px;
  display: flex;
  gap: 8px;
  align-items: center;
}
.url-bar input {
  flex: 1;
  padding: 9px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  outline: none;
  background: var(--card);
}
.url-bar input:focus { border-color: var(--accent); }
.url-bar .url-hint {
  font-size: 11px;
  color: var(--sub);
  white-space: nowrap;
}

/* ========== QUIZ MODE ========== */
.quiz-wrap {
  max-width: 500px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.quiz-topbar {
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  color: var(--sub);
  background: var(--card);
  border-bottom: 1px solid var(--border);
}
.quiz-topbar .back-btn {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: var(--text);
  padding: 4px;
  line-height: 1;
}
.progress-bar-wrap {
  height: 3px;
  background: var(--border);
}
.progress-bar-fill {
  height: 100%;
  background: var(--accent);
  transition: width .3s;
}
.quiz-body {
  flex: 1;
  padding: 20px 16px;
}
.question-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px 18px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  margin-bottom: 14px;
}
.question-card .q-type-tag {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
  margin-bottom: 10px;
  display: inline-block;
}
.q-type-tag.tag-single { background: #dbeafe; color: #2563eb; }
.q-type-tag.tag-multi { background: #fef3c7; color: #d97706; }
.q-type-tag.tag-judge { background: #ede9fe; color: #7c3aed; }
.q-type-tag.tag-calc { background: #fce7f3; color: #db2777; }
.question-card .q-title {
  font-size: 16px;
  font-weight: 600;
  line-height: 1.6;
  margin-bottom: 18px;
}

.option-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px;
  margin-bottom: 8px;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: #fff;
  cursor: pointer;
  transition: all .12s;
  font-size: 15px;
  line-height: 1.5;
}
.option-item:active { transform: scale(0.98); }
.option-item .opt-indicator {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 2px solid #d1d5db;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  margin-top: 1px;
  transition: all .15s;
}
.option-item.selected .opt-indicator {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.multi-mode .option-item .opt-indicator {
  border-radius: 4px;
}
.option-item.selected {
  border-color: var(--accent);
  background: var(--accent-light);
}
.option-item.correct {
  border-color: var(--correct);
  background: var(--correct-bg);
}
.option-item.correct .opt-indicator {
  background: var(--correct);
  border-color: var(--correct);
  color: #fff;
}
.option-item.wrong {
  border-color: var(--wrong);
  background: var(--wrong-bg);
}
.option-item.wrong .opt-indicator {
  background: var(--wrong);
  border-color: var(--wrong);
  color: #fff;
}
.option-item:disabled { pointer-events: none; opacity: 1; }

.feedback {
  text-align: center;
  font-size: 15px;
  font-weight: 600;
  margin: 10px 0 0;
  min-height: 24px;
}
.feedback.ok { color: var(--correct); }
.feedback.bad { color: var(--wrong); }

.quiz-nav {
  display: flex;
  gap: 10px;
  padding: 0 16px 20px;
}
.quiz-nav button {
  flex: 1;
  padding: 14px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  font-family: inherit;
  transition: all .15s;
}
.quiz-nav button:active { transform: scale(0.97); }
.btn-confirm { background: var(--accent); color: #fff; }
.btn-confirm:disabled { background: #c7d2fe; }
.btn-next { background: var(--accent); color: #fff; }
.btn-next:disabled { background: #c7d2fe; }
.btn-skip { background: #f3f4f6; color: #6b7280; flex: 0.5 !important; }

/* ========== RESULT ========== */
.result-wrap {
  max-width: 500px;
  margin: 0 auto;
  padding: 40px 20px;
  text-align: center;
}
.result-wrap .big-score {
  font-size: 64px;
  font-weight: 800;
  color: var(--accent);
}
.result-wrap .score-label {
  font-size: 14px;
  color: var(--sub);
  margin-bottom: 20px;
}
.result-stats {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.stat-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.stat-card .stat-val { font-size: 22px; font-weight: 700; }
.stat-card .stat-lbl { font-size: 11px; color: var(--sub); }
.stat-card.ok .stat-val { color: var(--correct); }
.stat-card.bad .stat-val { color: var(--wrong); }

.review-list {
  text-align: left;
  max-width: 500px;
  margin: 0 auto 20px;
}
.review-item {
  background: var(--card);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  font-size: 13px;
}
.review-item .ri-q { font-weight: 600; margin-bottom: 4px; }
.review-item .ri-a { color: var(--correct); font-size: 12px; }
.review-item .ri-your { color: var(--wrong); font-size: 12px; }

/* ========== QR MODAL ========== */
.qr-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.qr-modal {
  background: #fff;
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  max-width: 360px;
  width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}
.qr-modal img {
  max-width: 240px;
  border-radius: 8px;
}
.qr-modal .qr-url {
  font-size: 11px;
  color: var(--sub);
  word-break: break-all;
  margin: 10px 0;
  background: #f9fafb;
  padding: 6px 10px;
  border-radius: 6px;
  max-height: 36px;
  overflow: hidden;
}
.qr-modal .qr-hint {
  font-size: 12px;
  color: var(--sub);
}
.qr-modal button {
  margin-top: 12px;
  padding: 8px 24px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #fff;
  cursor: pointer;
  font-size: 14px;
}

@keyframes popIn {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}
.star-pop { animation: popIn .35s ease-out; }

@media (max-width: 400px) {
  .question-card { padding: 16px 14px; }
  .question-card .q-title { font-size: 15px; }
  .option-item { font-size: 14px; padding: 10px 12px; }
}
</style>
</head>
<body>

<!-- ==================== ACTIVATION LOCK ==================== -->
<div id="lockScreen">
<div style="max-width:420px;margin:0 auto;padding:60px 24px;text-align:center">
  <div style="font-size:64px;margin-bottom:12px">🔐</div>
  <h2 style="font-size:22px;font-weight:700;margin-bottom:4px">财务管理 · 刷题题库</h2>
  <p style="font-size:13px;color:var(--sub);margin-bottom:28px">9 章 · 163 题 · 输入激活码解锁全部内容</p>

  <div style="background:var(--card);border-radius:var(--radius);padding:24px 20px;box-shadow:var(--shadow);border:1px solid var(--border)">
    <input type="text" id="actCode" class="code-input"
           placeholder="XXXX-XXXX-XXXX"
           maxlength="14"
           autocomplete="off"
           style="width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:10px;font-size:20px;text-align:center;letter-spacing:3px;font-family:monospace;font-weight:700;outline:none;text-transform:uppercase" />
    <p style="font-size:11px;color:var(--sub);margin:8px 0 16px">请输入购买课程后获得的 12 位激活码</p>

    <button id="btnActivate" onclick="doActivate()"
            style="width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer">
      激活题库
    </button>

    <div id="actError" style="color:#dc2626;font-size:13px;margin-top:12px;display:none"></div>
  </div>

  <p style="font-size:12px;color:var(--sub);margin-top:20px">如未购买激活码，请联系客服获取</p>
</div>
</div>

<!-- ==================== HOME ==================== -->
<div id="homeMode" style="display:none">
<div class="home-wrap">
  <div class="home-header">
    <h1>财务管理 · 刷题练习</h1>
    <p class="subtitle" id="homeSub">共 9 章 · 163 题</p>
    <div style="margin-top:12px;display:flex;gap:8px;justify-content:center;align-items:center">
      <button onclick="showMainQR()" style="background:#fff;border:1px solid var(--border);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600">📱 生成全部题目二维码</button>
    </div>
  </div>
  <div class="url-bar" style="margin-bottom:20px">
    <input type="text" id="baseUrl" placeholder="托管地址（生成二维码用）" />
    <span class="url-hint" style="cursor:pointer" onclick="autoDetectUrl()" title="自动检测">🔍 自动</span>
  </div>
  <div class="chapter-grid" id="chapterGrid"></div>
  <div id="homeFooter" style="text-align:center;margin-top:28px;color:var(--sub);font-size:12px">
    点击章节开始刷题 · 点击 📱 生成二维码
  </div>
</div>
</div>

<!-- ==================== QUIZ ==================== -->
<div id="quizMode" style="display:none">
<div class="quiz-wrap">
  <div class="quiz-topbar">
    <button class="back-btn" onclick="backToHome()" title="返回">←</button>
    <span id="quizTitle" style="font-weight:600;color:var(--text)">刷题</span>
    <div style="display:flex;align-items:center;gap:8px">
      <button id="btnShuffle" onclick="toggleShuffle()" style="background:none;border:none;font-size:16px;cursor:pointer;padding:2px 4px" title="随机打乱">🔀</button>
      <span id="progressText">1/10</span>
    </div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
  </div>
  <div class="quiz-body" id="quizBody"></div>
  <div class="quiz-nav">
    <button class="btn-skip" id="btnSkip" onclick="skipQuestion()">跳过</button>
    <button class="btn-next" id="btnNext" onclick="nextQuestion()" disabled>下一题 →</button>
  </div>
</div>
</div>

<!-- ==================== RESULT ==================== -->
<div id="resultMode" style="display:none">
<div class="result-wrap" id="resultContent"></div>
</div>

<!-- ==================== QR MODAL ==================== -->
<div id="qrOverlay" class="qr-overlay" style="display:none" onclick="if(event.target===this)closeQR()">
<div class="qr-modal">
  <h3 style="margin-bottom:12px" id="qrChapterTitle"></h3>
  <img id="qrImage" alt="QR Code" crossorigin="anonymous" />
  <div class="qr-url" id="qrUrlText"></div>
  <div class="qr-hint" id="qrHint"></div>
  <div style="display:flex;gap:8px;justify-content:center;margin-top:12px">
    <button onclick="downloadQR()" style="background:var(--accent);color:#fff;padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:14px">下载二维码</button>
    <button onclick="closeQR()" style="background:#f3f4f6;padding:8px 18px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:14px">关闭</button>
  </div>
</div>
</div>

<script>
// Auto-generated question bank
// Chapters: 11, Questions: 163
const QUESTION_BANK = {
  "作业一 财务管理总论": {
    "name": "作业一 财务管理总论",
    "questions": [
      {
        "q": "经济繁荣时期，不应该选择的财务战略是（    ）",
        "o": [
          "扩充厂房设备",
          "增加存货",
          "减少投资",
          "提高产品价格"
        ],
        "a": 2,
        "type": "single",
        "explanation": "正确答案为C：减少投资。请理解相关知识点，掌握判断依据。"
      },
      {
        "q": "下列财务管理目标中，同时考虑资金时间价值和投资风险因素的是（       ）。",
        "o": [
          "利润最大化",
          "产值最大化",
          "每股收益最大化",
          "企业价值最大化"
        ],
        "a": 3,
        "type": "single",
        "explanation": "正确答案为D：企业价值最大化。请理解相关知识点，掌握判断依据。"
      },
      {
        "q": "企业与所有者之间的财务关系反映的是（       ）。",
        "o": [
          "经营权与所有权关系",
          "投资与受资关系",
          "债权债务关系",
          "债务债权关系"
        ],
        "a": 0,
        "type": "single",
        "explanation": "正确答案为A：经营权与所有权关系。请理解相关知识点，掌握判断依据。"
      },
      {
        "q": "在股份制企业，尤其是上市公司中，企业价值最大化目标往往演化为（        ）。",
        "o": [
          "每股收益最大化",
          "利润最大化",
          "股票账面价格最大化",
          "股价最大化"
        ],
        "a": 3,
        "type": "single",
        "explanation": "正确答案为D：股价最大化。请理解相关知识点，掌握判断依据。"
      },
      {
        "q": "下列经济活动中哪一项体现的是投资者和被投资者之间的财务关系。（      ）",
        "o": [
          "企业向国有资产投资公司支付利润",
          "企业向其他企业支付货款",
          "企业向国家税务机关缴纳税款",
          "企业向职工支付工资"
        ],
        "a": 0,
        "type": "single",
        "explanation": "正确答案为A：企业向国有资产投资公司支付利润。请理解相关知识点，掌握判断依据。"
      },
      {
        "q": "财务管理的核心工作环节为（       ）。",
        "o": [
          "财务预测",
          "财务决策",
          "财务预算",
          "财务控制"
        ],
        "a": 1,
        "type": "single",
        "explanation": "正确答案为B：财务决策。请理解相关知识点，掌握判断依据。"
      },
      {
        "q": "某上市公司职业经理人在任职期间不断提高在职消费，损害股东利益。这一现象所揭示的公司制企业的缺点主要是（       ）。",
        "o": [
          "产权问题",
          "激励问题",
          "代理问题",
          "责权分配问题"
        ],
        "a": 2,
        "type": "single",
        "explanation": "正确答案为C：代理问题。请理解相关知识点，掌握判断依据。"
      },
      {
        "q": "经营者对股东目标的背离表现在道德风险和逆向选择两个方面，下列属于道德风险的是（      ）。",
        "o": [
          "不愿为提高股价而冒险",
          "装修豪华的办公室",
          "借口工作需要乱花股东的钱",
          "蓄意压低股票价格，以个人名义借款买回"
        ],
        "a": 0,
        "type": "single",
        "explanation": "正确答案为A：不愿为提高股价而冒险。请理解相关知识点，掌握判断依据。"
      },
      {
        "q": "下列各项中，用于协调企业所有者与债权人矛盾的方法是（       ）。",
        "o": [
          "解聘",
          "监督",
          "激励",
          "停止借款"
        ],
        "a": 3,
        "type": "single",
        "explanation": "正确答案为D：停止借款。请理解相关知识点，掌握判断依据。"
      },
      {
        "q": "甲乙两个企业均投入1 000万元的资本，本年获利均为60万元，但甲企业的获利已经全部转化为现金，而乙企业则全部是应收账款。如果在分析时得出两个企业收益水平相同的结论，得出此结论的原因是（        ）。",
        "o": [
          "没有考虑利润的获取时间",
          "没有考虑所获利润与投入资本的关系",
          "没有考虑利润所承担风险的大小",
          "没有考虑剩余产品的创造能力"
        ],

function verifyCodeAsync(raw) {
  // Simple dictionary lookup - no crypto API needed
  try {
    var hash = CODE_HASH_MAP[raw];
    return Promise.resolve(hash || '');
  } catch(e) {
    return Promise.reject(e);
  }
}

function doActivate() {
  const input = document.getElementById('actCode');
  const raw = input.value.replace(/-/g, '').replace(/\s/g, '').toUpperCase();
  const errEl = document.getElementById('actError');
  const btn = document.getElementById('btnActivate');

  if (raw.length !== 12) {
    errEl.textContent = '激活码格式不正确，应为 12 位（XXXX-XXXX-XXXX）';
    errEl.style.display = 'block';
    return;
  }

  btn.textContent = '验证中...';
  btn.disabled = true;
  errEl.style.display = 'none';

  verifyCodeAsync(raw).then(hashHex => {
    if (VALID_HASHES.includes(hashHex)) {
      localStorage.setItem(ACT_KEY, raw);
      unlockScreen();
    } else {
      errEl.textContent = '激活码无效，请检查后重试';
      errEl.style.display = 'block';
      btn.textContent = '激活题库';
      btn.disabled = false;
    }
  }).catch(() => {
    errEl.textContent = '验证失败，请刷新后重试';
    errEl.style.display = 'block';
    btn.textContent = '激活题库';
    btn.disabled = false;
  });
}

function unlockScreen() {
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('homeMode').style.display = 'block';
  initHome();
}

function isActivated() {
  const saved = localStorage.getItem(ACT_KEY);
  if (!saved || saved.length !== 12) return false;
  // Verify against hashes
  const encoder = new TextEncoder();
  return crypto.subtle ? true : false; // Will be verified async
}

// ==================== HOME ====================
function initHome() {
  document.getElementById('homeMode').style.display = 'block';
  document.getElementById('quizMode').style.display = 'none';
  document.getElementById('resultMode').style.display = 'none';

  document.getElementById('baseUrl').value = loadHostUrl();

  const grid = document.getElementById('chapterGrid');
  const chapters = Object.values(QUESTION_BANK);
  const stats = loadStats();
  let totalQ = 0;
  let html = '';

  chapters.forEach(ch => {
    totalQ += ch.count;
    const types = countTypes(ch.questions);
    const typeBadges = [];
    if (types.single) typeBadges.push(`<span class="type-badge single">单选${types.single}</span>`);
    if (types.multi) typeBadges.push(`<span class="type-badge multi">多选${types.multi}</span>`);
    if (types.judge) typeBadges.push(`<span class="type-badge judge">判断${types.judge}</span>`);

    // Stats for this chapter
    const st = stats[ch.name];
    let statsHtml = '';
    if (st && st.times > 0) {
      statsHtml = `<div class="ch-stats">
        <span class="ch-stat-item" title="练习次数">📋 ${st.times}次</span>
        <span class="ch-stat-item best" title="历史最佳">🏆 ${st.best}%</span>
        <span class="ch-stat-item last" title="最近一次">📝 ${st.last}%</span>
        <span class="ch-stat-item" title="最近练习日期">📅 ${st.date}</span>
      </div>`;
    } else {
      statsHtml = `<div class="ch-stats"><span class="ch-stat-new">🆕 未练习</span></div>`;
    }

    html += `
      <div class="chapter-card" onclick="startChapter('${escAttr(ch.name)}')">
        <div class="ch-info">
          <div class="ch-name">${escHtml(ch.name)}</div>
          <div class="ch-meta">
            <span>${ch.count} 题</span>
            ${typeBadges.join(' ')}
          </div>
          ${statsHtml}
        </div>
        <span style="font-size:20px;cursor:pointer" onclick="event.stopPropagation();showQR('${escAttr(ch.name)}')" title="生成二维码">📱</span>
      </div>`;
  });

  document.getElementById('homeSub').textContent = `共 ${chapters.length} 章 · ${totalQ} 题`;
  grid.innerHTML = html;

  // Show reset button if any stats exist
  const hasStats = Object.keys(stats).length > 0;
  const footerEl = document.getElementById('homeFooter');
  if (footerEl) {
    footerEl.innerHTML = hasStats
      ? `<span style="cursor:pointer;color:var(--sub);font-size:12px" onclick="resetStats()">🗑 清除练习记录</span>`
      : '';
  }
}

function countTypes(qs) {
  const c = {};
  qs.forEach(q => { c[q.type] = (c[q.type] || 0) + 1; });
  return c;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ==================== HOST URL ====================
function loadHostUrl() {
  const saved = localStorage.getItem(URL_KEY) || '';
  if (!saved && window.location.protocol.startsWith('http')) {
    return window.location.href.replace(/#.*$/, '').replace(/\?.*$/, '');
  }
  return saved;
}

function autoDetectUrl() {
  if (window.location.protocol.startsWith('http')) {
    const url = window.location.href.replace(/#.*$/, '').replace(/\?.*$/, '');
    document.getElementById('baseUrl').value = url;
    localStorage.setItem(URL_KEY, url);
  } else {
    alert('当前为本地文件，请手动输入托管地址');
  }
}

// ==================== CHAPTER → QUIZ ====================
function startChapter(chName) {
  const ch = QUESTION_BANK[chName];
  if (!ch || !ch.questions || ch.questions.length === 0) return;

  currentChapter = chName;
  quizQuestions = [...ch.questions];
  currentIndex = 0;
  userAnswers = quizQuestions.map(q => q.type === 'multi' ? [] : -1);
  isRevealed = false;

  document.getElementById('homeMode').style.display = 'none';
  document.getElementById('quizMode').style.display = 'block';
  document.getElementById('resultMode').style.display = 'none';
  document.getElementById('quizTitle').textContent = chName;

  renderQuestion();
}

function toggleShuffle() {
  quizQuestions = shuffleArray([...quizQuestions]);
  currentIndex = 0;
  userAnswers = quizQuestions.map(q => q.type === 'multi' ? [] : -1);
  isRevealed = false;
  document.getElementById('btnShuffle').textContent = '✅';
  setTimeout(() => { document.getElementById('btnShuffle').textContent = '🔀'; }, 600);
  renderQuestion();
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ==================== RENDER QUESTION ====================
function renderQuestion() {
  const q = quizQuestions[currentIndex];
  const total = quizQuestions.length;

  document.getElementById('progressText').textContent = (currentIndex + 1) + ' / ' + total;
  document.getElementById('progressBar').style.width = (currentIndex / total * 100) + '%';

  const optLabels = ['A', 'B', 'C', 'D', 'E', 'F'];
  const userAns = userAnswers[currentIndex];
  const isMulti = q.type === 'multi';

  let tagClass = 'tag-single', tagText = '单选题';
  if (q.type === 'multi') { tagClass = 'tag-multi'; tagText = '多选题（多选）'; }
  if (q.type === 'judge') { tagClass = 'tag-judge'; tagText = '判断题'; }
  if (q.type === 'calc') { tagClass = 'tag-calc'; tagText = '计算分析题'; }

  // Calc questions: display-only mode
  if (q.type === 'calc') {
    const body = document.getElementById('quizBody');
    body.innerHTML = `
      <div class="question-card star-pop">
        <span class="q-type-tag tag-calc">计算分析题</span>
        <div class="q-title">${currentIndex + 1}. ${escHtml(q.q)}</div>
        <div style="background:#fdf2f8;border-radius:10px;padding:16px;margin-top:12px;font-size:13px;color:#9d174d;line-height:1.6">
          💡 本题为计算分析题，请自行计算后核对答案。
        </div>
      </div>`;
    document.getElementById('btnSkip').style.display = 'inline-block';
    const confirmBtn = document.getElementById('btnConfirmMulti');
    if (confirmBtn) confirmBtn.style.display = 'none';
    const nextBtn = document.getElementById('btnNext');
    nextBtn.style.display = 'inline-block';
    nextBtn.disabled = false;
    nextBtn.textContent = currentIndex < total - 1 ? '下一题 →' : '查看结果 📊';
    document.querySelector('.quiz-body').scrollIntoView({ behavior: 'smooth' });
    return;
  }

  const isAnswered = isMulti ? isRevealed : (userAns !== -1);

  let optionsHtml = q.o.map((opt, oi) => {
    let cls = '';
    if (isAnswered) {
      if (isMulti) {
        const correctIndices = Array.isArray(q.a) ? q.a : [q.a];
        const selectedIndices = Array.isArray(userAns) ? userAns : [];
        if (correctIndices.includes(oi) && selectedIndices.includes(oi)) cls = 'correct';
        else if (!correctIndices.includes(oi) && selectedIndices.includes(oi)) cls = 'wrong';
        else if (correctIndices.includes(oi) && !selectedIndices.includes(oi)) cls = 'correct';
      } else {
        if (oi === q.a) cls = 'correct';
        else if (oi === userAns && oi !== q.a) cls = 'wrong';
      }
    } else if (isMulti) {
      if (Array.isArray(userAns) && userAns.includes(oi)) cls = 'selected';
    } else {
      if (oi === userAns) cls = 'selected';
    }

    return `<div class="option-item ${cls}" onclick="${isMulti ? `toggleMulti(${oi})` : `selectAnswer(${oi})`}" ${isAnswered ? 'disabled' : ''}>
      <div class="opt-indicator">${optLabels[oi]}</div>
      <span>${escHtml(opt)}</span>
    </div>`;
  }).join('');

  // Feedback
  let feedbackHtml = '';
  if (isAnswered) {
    if (isMulti) {
      const correctIndices = Array.isArray(q.a) ? q.a : [q.a];
      const selectedIndices = Array.isArray(userAns) ? userAns : [];
      const isCorrect = arraysEqual([...correctIndices].sort(), [...selectedIndices].sort());
      const correctLetters = correctIndices.map(i => optLabels[i]).join('');
      feedbackHtml = `<div class="feedback ${isCorrect ? 'ok' : 'bad'}">
        ${isCorrect ? '✓ 回答正确！' : '✗ 正确答案是 ' + correctLetters}
      </div>`;
    } else {
      feedbackHtml = `<div class="feedback ${userAns === q.a ? 'ok' : 'bad'}">
        ${userAns === q.a ? '✓ 回答正确！' : '✗ 正确答案是 ' + optLabels[q.a]}
      </div>`;
    }
    // Show explanation if available
    if (q.explanation) {
      feedbackHtml += `<div class="explanation-box"><span class="exp-label">💡 解析</span>${escHtml(q.explanation)}</div>`;
    }
  }

  const body = document.getElementById('quizBody');
  body.innerHTML = `
    <div class="question-card star-pop ${isMulti ? 'multi-mode' : ''}">
      <span class="q-type-tag ${tagClass}">${tagText}</span>
      <div class="q-title">${currentIndex + 1}. ${escHtml(q.q)}</div>
      ${optionsHtml}
      ${feedbackHtml}
    </div>`;

  // Update buttons
  document.getElementById('btnSkip').style.display = isAnswered ? 'none' : 'inline-block';

  if (isMulti && !isRevealed) {
    // Show confirm button for multi-select
    const nav = document.querySelector('.quiz-nav');
    const confirmBtn = document.getElementById('btnConfirmMulti');
    if (!confirmBtn) {
      const btn = document.createElement('button');
      btn.id = 'btnConfirmMulti';
      btn.className = 'btn-confirm';
      btn.textContent = '确认答案 ✓';
      btn.onclick = confirmMultiAnswer;
      nav.insertBefore(btn, document.getElementById('btnNext'));
    }
    document.getElementById('btnConfirmMulti').style.display = 'inline-block';
    document.getElementById('btnNext').style.display = 'none';
  } else {
    const confirmBtn = document.getElementById('btnConfirmMulti');
    if (confirmBtn) confirmBtn.style.display = 'none';
    const nextBtn = document.getElementById('btnNext');
    nextBtn.style.display = isAnswered ? 'inline-block' : 'none';
    nextBtn.disabled = !isAnswered;
    nextBtn.textContent = currentIndex < total - 1 ? '下一题 →' : '查看结果 📊';
  }

  document.querySelector('.quiz-body').scrollIntoView({ behavior: 'smooth' });
}

function arraysEqual(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) { if (a[i] !== b[i]) return false; }
  return true;
}

// ==================== ANSWER HANDLING ====================
function selectAnswer(oi) {
  if (isRevealed) return;
  const q = quizQuestions[currentIndex];
  if (q.type === 'multi') return; // handled by toggleMulti
  userAnswers[currentIndex] = oi;
  isRevealed = true;
  renderQuestion();

  // Auto-advance if correct
  if (oi === q.a) {
    setTimeout(() => advanceOrFinish(), 800);
  }
}

function toggleMulti(oi) {
  if (isRevealed) return;
  if (!Array.isArray(userAnswers[currentIndex])) {
    userAnswers[currentIndex] = [];
  }
  const arr = userAnswers[currentIndex];
  const idx = arr.indexOf(oi);
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push(oi);
  renderQuestion();
}

function confirmMultiAnswer() {
  if (isRevealed) return;
  isRevealed = true;
  renderQuestion();
}

function skipQuestion() {
  const q = quizQuestions[currentIndex];
  if (q.type === 'multi') {
    userAnswers[currentIndex] = [];
  } else {
    userAnswers[currentIndex] = -1;
  }
  isRevealed = false;
  advanceOrFinish();
}

function nextQuestion() {
  isRevealed = false;
  advanceOrFinish();
}

function advanceOrFinish() {
  if (currentIndex < quizQuestions.length - 1) {
    currentIndex++;
    isRevealed = false;
    renderQuestion();
  } else {
    showResult();
  }
}

// ==================== RESULT ====================
function showResult() {
  document.getElementById('quizMode').style.display = 'none';
  document.getElementById('resultMode').style.display = 'block';

  const total = quizQuestions.length;
  let correct = 0, wrong = 0, skipped = 0, calcCount = 0;
  const optLabels = ['A', 'B', 'C', 'D', 'E', 'F'];
  const wrongList = [];
  const quizTotal = quizQuestions.filter(q => q.type !== 'calc').length;

  quizQuestions.forEach((q, i) => {
    const ua = userAnswers[i];
    if (q.type === 'calc') {
      calcCount++;
      return;
    }
    if (q.type === 'multi') {
      if (!Array.isArray(ua) || ua.length === 0) { skipped++; wrongList.push({i, skipped: true}); return; }
      const correctSet = [...(Array.isArray(q.a) ? q.a : [q.a])].sort();
      const userSet = [...ua].sort();
      if (arraysEqual(correctSet, userSet)) correct++;
      else { wrong++; wrongList.push({i, skipped: false}); }
    } else {
      if (ua === -1) { skipped++; wrongList.push({i, skipped: true}); return; }
      if (ua === q.a) correct++;
      else { wrong++; wrongList.push({i, skipped: false}); }
    }
  });

  const pct = quizTotal > 0 ? Math.round(correct / quizTotal * 100) : 0;

  // Save progress to localStorage
  if (currentChapter && QUESTION_BANK[currentChapter]) {
    saveStats(currentChapter, correct, total, quizTotal);
  }

  let html = `
    <div class="big-score star-pop">${pct}%</div>
    <div class="score-label">正确率（不含计算题）</div>
    <div class="result-stats">
      <div class="stat-card ok"><div class="stat-val">${correct}</div><div class="stat-lbl">正确</div></div>
      <div class="stat-card bad"><div class="stat-val">${wrong}</div><div class="stat-lbl">错误</div></div>
      <div class="stat-card"><div class="stat-val">${skipped}</div><div class="stat-lbl">跳过</div></div>
      ${calcCount > 0 ? `<div class="stat-card"><div class="stat-val">${calcCount}</div><div class="stat-lbl">计算题</div></div>` : ''}
      <div class="stat-card"><div class="stat-val">${quizTotal}</div><div class="stat-lbl">答题总计</div></div>
    </div>`;

  // Wrong questions review
  if (wrongList.length > 0) {
    html += `<h4 style="margin-bottom:10px">📝 错题/未答回顾</h4><div class="review-list">`;
    wrongList.forEach(w => {
      const q = quizQuestions[w.i];
      const ua = userAnswers[w.i];
      if (q.type === 'multi') {
        const correctLetters = (Array.isArray(q.a) ? q.a : [q.a]).map(i => optLabels[i]).join(', ');
        const userLetters = (Array.isArray(ua) ? ua : []).map(i => optLabels[i]).join(', ') || '(未答)';
        html += `<div class="review-item">
          <div class="ri-q">${w.i + 1}. ${escHtml(q.q)}</div>
          <div class="ri-your">你的答案：${userLetters}</div>
          <div class="ri-a">正确答案：${correctLetters}</div>
        </div>`;
      } else {
        html += `<div class="review-item">
          <div class="ri-q">${w.i + 1}. ${escHtml(q.q)}</div>
          <div class="ri-your">你的答案：${ua !== -1 ? optLabels[ua] + '. ' + escHtml(q.o[ua] || '') : '(未答)'}</div>
          <div class="ri-a">正确答案：${optLabels[q.a]}. ${escHtml(q.o[q.a] || '')}</div>
        </div>`;
      }
    });
    html += `</div>`;
  }

  html += `
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn-next" onclick="retryWrong()" style="flex:none;padding:10px 20px;border-radius:8px;border:none;background:#f3f4f6;color:#6b7280;font-size:14px;font-weight:600;cursor:pointer" ${wrong === 0 ? 'disabled' : ''}>🔄 重做错题 (${wrong})</button>
      <button class="btn-next" onclick="retryAll()" style="flex:none;padding:10px 20px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer">🔀 重新开始</button>
    </div>
    <div style="margin-top:12px">
      <button onclick="backToHome()" style="background:none;border:none;color:var(--sub);cursor:pointer;font-size:14px">← 返回章节列表</button>
    </div>`;

  document.getElementById('resultContent').innerHTML = html;
  document.getElementById('resultContent').scrollIntoView({ behavior: 'smooth' });
}

function retryWrong() {
  const wrongQs = quizQuestions.filter((q, i) => {
    const ua = userAnswers[i];
    if (q.type === 'calc') return false;
    if (q.type === 'multi') {
      if (!Array.isArray(ua) || ua.length === 0) return true;
      const correctSet = [...(Array.isArray(q.a) ? q.a : [q.a])].sort();
      return !arraysEqual(correctSet, [...ua].sort());
    }
    return ua === -1 || ua !== q.a;
  });
  if (wrongQs.length === 0) return;
  quizQuestions = shuffleArray(wrongQs);
  currentIndex = 0;
  userAnswers = quizQuestions.map(q => q.type === 'multi' ? [] : -1);
  isRevealed = false;

  document.getElementById('resultMode').style.display = 'none';
  document.getElementById('quizMode').style.display = 'block';
  document.getElementById('quizTitle').textContent = (currentChapter || '刷题') + ' · 错题重做';
  renderQuestion();
}

function retryAll() {
  quizQuestions = shuffleArray([...quizQuestions]);
  currentIndex = 0;
  userAnswers = quizQuestions.map(q => q.type === 'multi' ? [] : -1);
  isRevealed = false;

  document.getElementById('resultMode').style.display = 'none';
  document.getElementById('quizMode').style.display = 'block';
  renderQuestion();
}

function backToHome() {
  document.getElementById('quizMode').style.display = 'none';
  document.getElementById('resultMode').style.display = 'none';
  initHome();
}

// ==================== QR CODE ====================
function showMainQR() {
  const hostUrl = document.getElementById('baseUrl').value.trim();
  if (!hostUrl) {
    alert('请先填写托管地址');
    return;
  }
  const cleanUrl = hostUrl.replace(/#.*$/, '').replace(/\?.*$/, '');
  const qrApiUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(cleanUrl);
  document.getElementById('qrOverlay').style.display = 'flex';
  document.getElementById('qrChapterTitle').textContent = '财务管理 · 全部章节';
  document.getElementById('qrImage').src = qrApiUrl;
  document.getElementById('qrUrlText').textContent = cleanUrl;
  document.getElementById('qrHint').textContent = '共 9 章 · 163 题 · 扫码选择章节刷题';
}

function showQR(chName) {
  const hostUrl = document.getElementById('baseUrl').value.trim();
  if (!hostUrl) {
    alert('请先填写托管地址（此 HTML 文件的完整 URL），例如：\nhttps://yourname.github.io/quiz-app.html');
    return;
  }

  const cleanUrl = hostUrl.replace(/#.*$/, '').replace(/\?.*$/, '');
  const ch = QUESTION_BANK[chName];
  if (!ch) return;

  // Encode chapter name for URL
  const encodedChapter = encodeURIComponent(chName);
  const fullUrl = cleanUrl + '#chapter=' + encodedChapter;
  const qrApiUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(fullUrl);

  document.getElementById('qrOverlay').style.display = 'flex';
  document.getElementById('qrChapterTitle').textContent = chName;
  document.getElementById('qrImage').src = qrApiUrl;
  document.getElementById('qrUrlText').textContent = fullUrl;
  document.getElementById('qrHint').textContent = `共 ${ch.count} 题 · 微信/浏览器扫码即可刷题`;
}

function downloadQR() {
  const img = document.getElementById('qrImage');
  const chName = document.getElementById('qrChapterTitle').textContent;
  // Use canvas to download (avoids CORS issues)
  const canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth || 300;
  canvas.height = img.naturalHeight || 300;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const link = document.createElement('a');
  link.download = chName + '_二维码.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function closeQR() {
  document.getElementById('qrOverlay').style.display = 'none';
}

// ==================== INIT ====================
function init() {
  try {
    var savedCode = localStorage.getItem(ACT_KEY);
    if (savedCode && savedCode.length === 12) {
      verifyCodeAsync(savedCode).then(function(hashHex) {
        if (VALID_HASHES.includes(hashHex)) {
          document.getElementById('lockScreen').style.display = 'none';
          proceedAfterActivation();
        } else {
          localStorage.removeItem(ACT_KEY);
          document.getElementById('lockScreen').style.display = 'block';
        }
      }).catch(function() {
        document.getElementById('lockScreen').style.display = 'none';
        proceedAfterActivation();
      });
    } else {
      document.getElementById('lockScreen').style.display = 'block';
    }
  } catch(e) {
    document.getElementById('lockScreen').style.display = 'block';
    console.error('Init error:', e);
  }
}

function proceedAfterActivation() {
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('homeMode').style.display = 'block';

  // Check if loaded via QR code (hash #chapter=X)
  const hash = window.location.hash.slice(1);
  if (hash.startsWith('chapter=')) {
    const chName = decodeURIComponent(hash.slice(8));
    if (QUESTION_BANK[chName]) {
      if (window.location.protocol.startsWith('http')) {
        const url = window.location.href.replace(/#.*$/, '').replace(/\?.*$/, '');
        localStorage.setItem(URL_KEY, url);
      }
      initHome();
      startChapter(chName);
      return;
    }
  }

  // Check old-style base64 encoded questions in hash
  if (hash && hash.length > 10 && !hash.startsWith('chapter=')) {
    const decoded = tryDecodeLegacy(hash);
    if (decoded && decoded.length > 0) {
      currentChapter = '自定义题目';
      quizQuestions = shuffleArray(decoded.map(q => ({
        ...q,
        type: q.type || 'single',
        o: q.o || ['', '', '', ''],
        a: q.a || 0
      })));
      currentIndex = 0;
      userAnswers = quizQuestions.map(q => q.type === 'multi' ? [] : -1);
      isRevealed = false;
      document.getElementById('homeMode').style.display = 'none';
      document.getElementById('quizMode').style.display = 'block';
      document.getElementById('quizTitle').textContent = '自定义题目';
      renderQuestion();
      return;
    }
  }

  initHome();
}

function tryDecodeLegacy(b64url) {
  try {
    let b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  } catch { return null; }
}

init();
</script>

name = "quiz-activation"
main = "index.js"
compatibility_date = "2024-01-01"

# 免费计划: 100k 请求/天, 无需绑卡
# 部署: npx wrangler deploy
# 首次需创建 KV: npx wrangler kv:namespace create QUIZ_CODES
# 然后更新下面的 id

[[kv_namespaces]]
binding = "QUIZ_CODES"
id = "REPLACE_WITH_YOUR_KV_ID"
preview_id = "REPLACE_WITH_YOUR_KV_ID"
